<article>
  <header>
    <h1 data-uf="header-main">{{ headings().main }}</h1>
    <p class="header--label code" data-uf="header-sub">{{ headings().sub }}</p>
  </header>
  @defer (on immediate; hydrate on idle) {
    <ui-movie-list (paginate)="paginate()" [movies]="movies$">
    </ui-movie-list>
    @if (loading()) {
      <div class="loader"></div>
    }
  }
</article>
