<header class="strip">
  <button
    uiHamburgerButton
    data-uf="menu-btn"
    class="strip--drawer-toggle"
    aria-label="Open the index"
    [attr.aria-expanded]="sideDrawerOpen()"
    aria-controls="index"
    (click)="sideDrawerOpen.set(!sideDrawerOpen())"
  ></button>

  <a class="strip--mark" aria-label="Main page" href="/">
    <fast-svg name="movies-logo" width="104" height="22" />
  </a>

  <ui-search-bar
    class="strip--search"
    [query]="search()"
    (searchSubmit)="searchMovie($event)"
  />

  <div class="strip--tools">
    <ui-dark-mode-toggle />

    <div class="account" [class.open]="accountMenuOpen()">
      <button
        data-uf="profile-menu-button"
        type="button"
        aria-label="Profile menu"
        [attr.aria-expanded]="accountMenuOpen()"
        aria-controls="account-menu"
        name="profile"
        class="account--button"
        (mouseenter)="ui.loadAccountMenu()"
        (focus)="ui.loadAccountMenu()"
        (click)="toggleAccountMenu()"
      >
        <fast-svg name="account" size="18" />
      </button>
      <div id="account-menu" class="account--menu" data-uf="profile-menu-content">
        @if (accountMenuComponent(); as accountMenuComponent) {
          <ng-container [lazy]="accountMenuComponent" />
        } @else {
          <span class="code">Loading</span>
        }
      </div>
    </div>
  </div>
</header>

<ui-side-drawer [(opened)]="sideDrawerOpen">
  <nav id="index" class="index" aria-label="Open the index">
    <p class="index--label code">Discover</p>
    <a
      aria-label="Popular"
      data-uf="menu-cat-popular"
      class="index--entry"
      [routerLink]="['/list', 'category', 'popular']"
      routerLinkActive="active"
    >
      <fast-svg class="index--icon" name="popular" size="14" />
      <span>Popular</span>
    </a>
    <a
      data-uf="menu-cat-topRated"
      class="index--entry"
      [routerLink]="['/list', 'category', 'top_rated']"
      routerLinkActive="active"
    >
      <fast-svg class="index--icon" name="top_rated" size="14" />
      <span>Top Rated</span>
    </a>
    <a
      data-uf="menu-cat-upcoming"
      class="index--entry"
      [routerLink]="['/list', 'category', 'upcoming']"
      routerLinkActive="active"
    >
      <fast-svg class="index--icon" name="upcoming" size="14" />
      <span>Upcoming</span>
    </a>

    <p class="index--label code">Genres</p>
    @for (genre of genres(); track trackByGenre($index, genre)) {
      <a
        [attr.data-uf]="'menu-gen-' + genre.id"
        class="index--entry"
        [routerLink]="['/list', 'genre', genre.id]"
        routerLinkActive="active"
      >
        <fast-svg class="index--icon" name="genre" size="14" />
        <span>{{ genre.name }}</span>
      </a>
    }
  </nav>

  <footer class="index--source">
    <span class="code">Source</span>
    <a
      aria-label="The movie DB website"
      href="https://www.themoviedb.org/"
      target="_blank"
      rel="noreferrer noopener"
    >
      <fast-svg name="tmdb-logo" width="62" height="25" />
    </a>
  </footer>
</ui-side-drawer>

<main class="sheet">
  <ng-content />
</main>
