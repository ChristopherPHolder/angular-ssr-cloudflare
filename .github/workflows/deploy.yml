name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two production deploys race; queue them instead of cancelling, so
# an in-flight deploy is always allowed to finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://angular-ssr-cloudflare.toholderandrews-4c2.workers.dev
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # No -c: the build is what produces the config Wrangler deploys. The
      # Cloudflare Vite plugin writes dist/ssr/wrangler.json with the resolved
      # `main` and assets directory, and points .wrangler/deploy/config.json at
      # it. Naming wrangler.jsonc here would deploy the source config instead,
      # which has no assets directory.
      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test
        run: |
          curl --fail --show-error --silent --location \
            --retry 5 --retry-delay 3 --retry-all-errors \
            --output /dev/null \
            https://angular-ssr-cloudflare.toholderandrews-4c2.workers.dev/
