name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

# One Preview per PR. A new push supersedes the run it interrupts.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy preview
    # Repository secrets are not exposed to pull requests from forks, so a fork
    # PR would fail at the Cloudflare step. Skip it rather than fail it.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Deploys dist/ssr/wrangler.json, written by the build — see deploy.yml.
      - name: Create or update Preview
        id: preview
        run: |
          set -o pipefail
          output="$(npx wrangler preview --name "pr-${PR_NUMBER}" --json)"
          printf '%s\n' "$output"
          preview_url="$(printf '%s' "$output" | jq -er '.preview.urls[0]')"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Comment before probing, so the URL is posted even if the Worker is
      # unhealthy. `--edit-last` keeps one comment instead of one per push.
      - name: Comment the Preview URL
        run: |
          body="$(printf 'Preview deployed: %s\n\nCommit `%s` — updated on every push to this PR.' \
            "$PREVIEW_URL" "${HEAD_SHA:0:7}")"
          gh pr comment "$PR_NUMBER" --edit-last --create-if-none --body "$body"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
          # GITHUB_SHA is the merge commit on a pull_request event, not the
          # commit that was actually built.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Catches SSR failures that a green build hides — in particular a Host
      # header rejected by `allowedHosts` in src/server.ts, which returns 400.
      - name: Smoke test the Preview
        run: |
          curl --fail --show-error --silent --location \
            --retry 5 --retry-delay 3 --retry-all-errors \
            --output /dev/null "$PREVIEW_URL"
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}

  cleanup:
    name: Delete preview
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Exits non-zero when there is nothing to delete, which is the normal
      # case for a PR closed before its first Preview ever deployed. Cleanup
      # failing loudly over that is noise, so swallow it.
      - name: Delete the Preview
        run: |
          npx wrangler preview delete --name "pr-${PR_NUMBER}" --skip-confirmation \
            || echo "No Preview to delete for pr-${PR_NUMBER}."
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
